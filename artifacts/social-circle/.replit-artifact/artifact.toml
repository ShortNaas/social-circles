kind = "web"
previewPath = "/"
title = "Social Circle"
version = "1.0.0"
id = "artifacts/social-circle"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18669

[services.development]
run = "pnpm --filter @workspace/social-circle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-circle", "run", "build" ]
publicDir = "artifacts/social-circle/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18669"
BASE_PATH = "/"
